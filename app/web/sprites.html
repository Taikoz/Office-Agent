<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Atelier sprites</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23081746%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%223.2%22 fill=%22%23fbaa08%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/sprites/lab.css">
</head>
<body>
<header>
  <h1>ATELIER <span>SPRITES</span></h1>
  <a href="/">← bureau</a>
</header>
<main>
  <section class="stage">
    <canvas id="hero" width="240" height="384" aria-label="Aperçu animé du personnage"></canvas>
    <div class="row" id="poses" role="group" aria-label="Pose"></div>
    <div class="row">
      <button id="flip" title="Retourner (l'autre sens)">⇄ MIROIR</button>
      <button id="bg" title="Changer le fond">▦ FOND</button>
      <button id="rand" title="Tenue au hasard">🎲 HASARD</button>
      <button id="reset" title="Tenue par défaut">↺ DÉFAUT</button>
      <button id="copy" title="Copier la tenue (JSON)">📋 COPIER</button>
    </div>
    <canvas id="strip" aria-label="Toutes les images de la tenue"></canvas>
    <p class="hint">Toutes les images, pose par pose (4 images chacune).<br>
      Sources : <code>sprites/src/</code> → <code>python3 -I app/sprites/tools/build_sprites.py</code> → recharge la page.</p>
  </section>
  <section class="wardrobe" id="wardrobe" aria-label="Garde-robe"></section>
</main>
<script src="static/sprites/lab.js"></script>
</body>
</html>
